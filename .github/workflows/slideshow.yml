name: Build dashboard slideshow

on:
  workflow_dispatch:
  push:
    paths:
      - "Project_*/images/Screenshot.png"
      - "make_slideshow.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python make_slideshow.py
      - name: Commit the GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard-slideshow.gif
          git diff --cached --quiet || git commit -m "Update dashboard slideshow"
          git push
